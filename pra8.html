<!DOCTYPE html>
<html>
<head>
    <title>List Demo</title>
    <link rel="stylesheet" href="pra8.css">
</head>
<body>

<div class="container">
    <h1>HTML List Tags</h1>

    <div class="box">
        <h2>Ordered List</h2>
        <ol>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ol>
    </div>

    <div class="box">
        <h2>Unordered List</h2>
        <ul>
            <li>Apple</li>
            <li>Banana</li>
            <li>Mango</li>
        </ul>
    </div>

    <div class="box">
        <h2>Description List</h2>
        <dl>
            <dt>HTML</dt>
            <dd>Markup Language</dd>
        </dl>
    </div>
</div>

</body>
</html>
