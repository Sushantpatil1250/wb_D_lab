<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /* Modern gradient background */
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .container {
            width: 350px;
        }

        .box1 {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #667eea;
        }

        /* Attractive Button */
        #b1 {
            width: 100%;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        #b1:hover {
            background: linear-gradient(135deg, #43cea2, #185a9d);
        }

        #b1:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Employee Registration</h1>

    <div class="box1">
        <label>Employee Name:</label>
        <input type="text" placeholder="Enter your name">

        <label>Employee ID:</label>
        <input type="number" placeholder="Enter your ID">

        <label>Date of Birth:</label>
        <input type="date">

        <label>City:</label>
        <input type="text">

        <label>Address:</label>
        <textarea></textarea>

        <label>Age:</label>
        <input type="number">

        <label>Email:</label>
        <input type="email">

        <input type="button" value="Submit" id="b1">
    </div>
</div>

</body>
</html>
